# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: somaliercontam_restrictsites
description: Restrict a somalier sites VCF to (padded) panel target intervals
keywords:
- sites
- panel
- somalier
- bed
- vcf
tools:
- somalier_contam:
    description: Contamination-source attribution and sample identity on top of somalier allele counts
    homepage: https://github.com/nf-core/contaminationqc
    documentation: https://github.com/nf-core/contaminationqc/blob/master/docs/usage.md
    tool_dev_url: https://github.com/nf-core/contaminationqc
    licence:
    - MIT
    identifier: ''
input:
- - meta:
      type: map
      description: 'Groovy Map containing sites information

        e.g. [ id:''sites'' ]

        '
  - sites:
      type: file
      description: somalier sites VCF
      pattern: '*.{vcf,vcf.gz}'
      ontologies:
      - edam: http://edamontology.org/format_3016
- - meta2:
      type: map
      description: 'Groovy Map containing panel information

        e.g. [ id:''panel'' ]

        '
  - bed:
      type: file
      description: Panel target intervals
      pattern: '*.{bed,bed.gz}'
      ontologies:
      - edam: http://edamontology.org/format_3003
output:
  vcf:
  - - meta:
        type: map
        description: 'Groovy Map containing sample information

          e.g. [ id:''sample1'' ]

          '
    - '*.vcf':
        type: file
        description: Sites VCF restricted to the panel (plain text)
        pattern: '*.vcf'
        ontologies: []
  versions_somalier_contam:
  - &id001
    - ${task.process}:
        type: string
        description: The name of the process
    - somalier_contam:
        type: string
        description: The name of the tool
    - somalier_contam.py --version | sed "s/.* //":
        type: eval
        description: The expression to obtain the version of the tool
  versions_python:
  - &id002
    - ${task.process}:
        type: string
        description: The name of the process
    - python:
        type: string
        description: The name of the tool
    - python3 --version | sed "s/Python //":
        type: eval
        description: The expression to obtain the version of the tool
topics:
  versions:
  - *id001
  - *id002
authors:
- '@apeltzer'
maintainers:
- '@apeltzer'
