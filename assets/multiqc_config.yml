report_comment: >
  This report has been generated by the <a href="https://github.com/nf-core/contaminationqc/tree/dev" target="_blank">nf-core/contaminationqc</a>
  analysis pipeline. For information about how to interpret these results, please see the
  <a href="https://nf-co.re/contaminationqc/dev/docs/output" target="_blank">documentation</a>.
report_section_order:
  "nf-core-contaminationqc-methods-description":
    order: -1000
  software_versions:
    order: -1001
  "nf-core-contaminationqc-summary":
    order: -1002
  contaminationqc_summary:
    order: 900

export_plots: true

# somalier stores '<sample>__<SM tag>' as sample name; report pipeline sample IDs
sample_names_replace_regex: true
sample_names_replace:
  "^(.+?)__.*$": "\\1"

custom_data:
  contaminationqc_summary:
    section_name: "Contamination and source attribution"

disable_version_detection: true
