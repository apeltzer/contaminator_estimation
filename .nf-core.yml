repository_type: pipeline

nf_core_version: 4.2.2

lint:
  # logos are rendered by nf-core/tools; font rendering differs between macOS and the Linux CI runners
  files_unchanged:
    - assets/nf-core-contaminationqc_logo_light.png
    - docs/images/nf-core-contaminationqc_logo_light.png
    - docs/images/nf-core-contaminationqc_logo_dark.png

template:
  org: nf-core
  name: contaminationqc
  description: Sample contamination, contamination-source attribution, sample identity
    and non-human (Kraken2) screening for targeted-panel BAM/CRAM files using somalier.
  author: Alexander Peltzer
  version: 1.0.0dev
  force: true
  outdir: .
  skip_features:
    - fastqc
    - gpu
  is_nfcore: true
